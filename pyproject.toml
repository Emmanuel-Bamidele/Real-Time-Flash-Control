[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcontrol"
version = "2.0.0"
description = "Real-time flash (sintering) experiment control, acquisition and visualization."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Emmanuel Bamidele", email = "correspondence.bamidele@gmail.com" }]
keywords = ["flash-sintering", "materials-science", "daq", "data-acquisition", "keithley"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Core logic + simulation run on these only. The GUI and real hardware
# backends pull in the optional extras below.
dependencies = []

[project.optional-dependencies]
gui = ["matplotlib>=3.5"]
hardware = ["nidaqmx>=0.6", "pyvisa>=1.12"]
dev = ["pytest>=7.0", "numpy>=1.21"]
build = ["build>=1.0", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/Emmanuel-Bamidele/Real-Time-Flash-Control"
Repository = "https://github.com/Emmanuel-Bamidele/Real-Time-Flash-Control"
Documentation = "https://github.com/Emmanuel-Bamidele/Real-Time-Flash-Control#readme"
Changelog = "https://github.com/Emmanuel-Bamidele/Real-Time-Flash-Control/blob/main/CHANGELOG.md"
"Citation (DOI)" = "https://doi.org/10.6084/m9.figshare.24054759.v1"

# Console entry point (works on every OS; supports --simulate-headless).
[project.scripts]
flashcontrol = "flashcontrol.__main__:main"

# GUI entry point — on Windows this launches without a console window.
[project.gui-scripts]
flashcontrol-gui = "flashcontrol.gui:run"

[tool.setuptools.packages.find]
include = ["flashcontrol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
